  <!-- ================= D: ADAPTIVE SAMPLING ================= -->
  <rect x="24" y="694" width="586" height="296" rx="10" fill="#f2f7fc" stroke="#c3d6e8"/>
  <text x="44" y="718" font-size="14" font-weight="700" fill="#1f5f9e">D · ADAPTIVE SAMPLING &amp; BED CONTROL  (Tasks 4 &amp; 5)</text>

  <rect x="44" y="734" width="256" height="118" rx="8" fill="#ffffff" stroke="#a9c4de"/>
  <text x="172" y="754" text-anchor="middle" font-size="11" font-weight="700" fill="#1f5f9e">SAMPLING RATE — Task 5</text>
  <text x="56" y="774" font-size="9.5" fill="#2c3d4e">MANUAL  slider 5–60 s ▸ applyCommand()</text>
  <text x="56" y="792" font-size="9.5" fill="#2c3d4e">AUTO   risk ≠ NORMAL ▸ 5 s (watch closely)</text>
  <text x="56" y="810" font-size="9.5" fill="#2c3d4e">       3 stable cycles ▸ 30 s (save power)</text>
  <text x="56" y="830" font-size="9.5" font-weight="700" fill="#1f5f9e">3-cycle hysteresis stops rate flapping</text>
  <text x="56" y="846" font-size="9" font-style="italic" fill="#5b6b7c">any manual change ▸ auto mode off</text>

  <rect x="44" y="862" width="256" height="110" rx="8" fill="#f4eefb" stroke="#c0a8e0"/>
  <text x="172" y="882" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b32a8">interruptibleDelay()</text>
  <text x="56" y="901" font-size="9.5" fill="#3c2c56">sleep in 1 s slices on the task's OWN wake queue</text>
  <text x="56" y="918" font-size="9.5" fill="#3c2c56">token arrives ▸ wake instantly (3 queues, 1 per waiter)</text>
  <text x="56" y="935" font-size="9.5" fill="#3c2c56">feed watchdog every slice</text>
  <text x="56" y="954" font-size="9.5" font-weight="700" fill="#5b32a8">one helper solves T1 watchdog + T5 response</text>

  <rect x="316" y="734" width="278" height="118" rx="8" fill="#ffffff" stroke="#a9c4de"/>
  <text x="455" y="754" text-anchor="middle" font-size="11" font-weight="700" fill="#1f5f9e">BED ELEVATION — Task 4</text>
  <text x="328" y="774" font-size="9.5" fill="#2c3d4e">PRESETS  sleep 10° · breathing 45° · emergency 90°</text>
  <text x="328" y="792" font-size="9.5" fill="#2c3d4e">SMOOTH  1°/25 ms ▸ 0–90° in ≈2.3 s</text>
  <text x="328" y="810" font-size="9.5" fill="#2c3d4e">EMERGENCY 3°/step ▸ ≈0.75 s, still ramped</text>
  <text x="328" y="830" font-size="9.5" fill="#2c3d4e">every path shares one rate limiter</text>
  <text x="328" y="846" font-size="9" font-style="italic" fill="#5b6b7c">no command can bypass the ramp</text>

  <rect x="316" y="862" width="278" height="110" rx="8" fill="#eefaf2" stroke="#9fd3ae"/>
  <text x="455" y="882" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f7a42">AUTO MODE — condition driven</text>
  <text x="328" y="902" font-size="9.5" fill="#2c3d4e">SpO₂ &lt; 85 % + CRITICAL  ▸ 90° upright</text>
  <text x="328" y="920" font-size="9.5" fill="#2c3d4e">SpO₂ &lt; 90 %             ▸ 45° breathing</text>
  <text x="328" y="938" font-size="9.5" fill="#2c3d4e">risk NORMAL             ▸ 10° resting</text>
  <text x="328" y="958" font-size="9.5" font-weight="700" fill="#0f7a42">manual overrides auto — auto never overrides manual</text>

  <!-- ================= E: BOOT ================= -->
  <rect x="630" y="694" width="586" height="296" rx="10" fill="#f7f9fb" stroke="#b9c7d4"/>
  <text x="650" y="718" font-size="14" font-weight="700" fill="#12212e">E · BOOT SEQUENCE</text>

  <rect x="650" y="734" width="240" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="662" y="756" font-size="10" fill="#2c3d4e">1 · Serial 115200 · initState()</text>

  <rect x="650" y="776" width="240" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="662" y="798" font-size="10" fill="#2c3d4e">2 · GPIO modes · 12-bit ADC</text>

  <rect x="650" y="818" width="240" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="662" y="840" font-size="10" fill="#2c3d4e">3 · DS18B20 · DHT22 · I²C OLED</text>

  <rect x="650" y="860" width="240" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="662" y="882" font-size="10" fill="#2c3d4e">4 · Servo attach · write 0°</text>

  <rect x="650" y="902" width="240" height="34" rx="6" fill="#f4eefb" stroke="#c0a8e0"/>
  <text x="662" y="924" font-size="10" fill="#3c2c56">5 · Create 5 queues · 3 mutexes · 1 sem</text>

  <rect x="928" y="734" width="276" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="940" y="756" font-size="10" fill="#2c3d4e">6 · Seed qVitals / qEnv (no stale reads)</text>

  <rect x="928" y="776" width="276" height="34" rx="6" fill="#fff6e5" stroke="#e8c37a"/>
  <text x="940" y="798" font-size="10" fill="#4a3a10">7 · Wi-Fi connect — 10 s cap, non-blocking</text>

  <rect x="928" y="818" width="276" height="34" rx="6" fill="#ffffff" stroke="#b9c7d4"/>
  <text x="940" y="840" font-size="10" fill="#2c3d4e">8 · Subscribe 7 control.* topics</text>

  <rect x="928" y="860" width="276" height="34" rx="6" fill="#fff6e5" stroke="#e8c37a"/>
  <text x="940" y="882" font-size="10" fill="#4a3a10">9 · Task watchdog 20 s · panic reset</text>

  <rect x="928" y="902" width="276" height="34" rx="6" fill="#e6f7ec" stroke="#0f9d58"/>
  <text x="940" y="924" font-size="10" font-weight="700" fill="#0f7a42">10 · Start 9 tasks · delete loop() task</text>

